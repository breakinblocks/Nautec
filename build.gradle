plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def releaseBuild = !(providers.gradleProperty('snapshot')
        .orElse(providers.environmentVariable('SNAPSHOT'))
        .getOrElse('false')).toBoolean()

version = releaseBuild ? mod_version : "${mod_version}-SNAPSHOT.${new Date().format('yyyyMMdd-HHmmss')}"
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup "software.bernie.geckolib"
        }
    }
}

base {
    archivesName = mod_id + "-" + minecraft_version + "-NeoForge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

tasks.named('test') { enabled = false }

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def gameTestDir = neoForge.runs.gameTestServer.gameDirectory
    doFirst {
        project.delete(gameTestDir.dir('world').get().asFile)
        gameTestDir.dir('config/nautec/generated_pack').get().asFile.mkdirs()
    }
}

neoForge {
    version = project.neoforge_full_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlayWorld').toString())
            }
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.add('--nogui')
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametestserver')
            systemProperty 'nautec.requireGameTests', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    implementation "maven.modrinth:curios:${curios_version}"
    implementation "maven.modrinth:jade:${jade_version}"

    compileOnly "org.appliedenergistics:guideme:${guideme_version}"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "maven.modrinth:starcatcher:${starcatcher_modrinth_id}"
}

tasks.withType(ProcessResources).configureEach {
    exclude '**/*.bbmodel'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neoforge_full_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

}

def deployDir = providers.gradleProperty('nautec_deploy_dir')
        .orElse(providers.environmentVariable('NAUTEC_DEPLOY_DIR'))

tasks.register('deployToPack') {
    group = 'nautec'
    description = 'Builds and drops the jar into a modpack instance, clearing out older Nautec jars first'
    dependsOn tasks.named('build')

    doLast {
        if (!deployDir.isPresent()) {
            throw new GradleException("No target set. Put nautec_deploy_dir in gradle.properties or set "
                    + "NAUTEC_DEPLOY_DIR, pointing at the instance's mods folder, or pass "
                    + "-Pnautec_deploy_dir=<path>")
        }

        def mods = file(deployDir.get())
        if (!mods.isDirectory()) {
            throw new GradleException("Not a directory: ${mods}")
        }

        def built = tasks.jar.archiveFile.get().asFile
        mods.listFiles({ File candidate ->
            candidate.name.startsWith(mod_id + "-") && candidate.name.endsWith(".jar")
        } as FileFilter).each {
            if (it.name != built.name) {
                logger.lifecycle("removing stale ${it.name}")
            }
            it.delete()
        }

        copy {
            from built
            into mods
        }
        logger.lifecycle("deployed ${built.name} to ${mods}")
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = releaseBuild ?
                "https://maven.breakinblocks.com/releases" :
                "https://maven.breakinblocks.com/snapshots"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

def publishDryRun = project.hasProperty("dryRun") && project.property("dryRun") == "true"

publishMods {
    dryRun = publishDryRun
    file = jar.archiveFile
    def changelogFile = file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${project.version}"
    displayName = "${mod_name} ${project.version}"
    type = ALPHA
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1727082"
        projectSlug = "nautec-2"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        requires("geckolib", "curios")
        optional("jei", "jade", "guideme", "apotheosis", "stellaris", "starcatcher")
    }
}

tasks.named('publishMods') {
    if (!releaseBuild && !publishDryRun) {
        doFirst {
            throw new GradleException("publishMods uploads to CurseForge, so it cannot run on a snapshot build. Drop -Psnapshot=true. "
                    + "Pass -PdryRun=true to test without uploading.")
        }
    }
    def mavenUser = providers.environmentVariable("MAVEN_USER")
    if (mavenUser.isPresent() && !publishDryRun) {
        dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('jar') {
    from(rootProject.files('LICENSE.md', 'LICENSE', 'LICENSE-SCANNABLE')) { into 'META-INF' }
}
