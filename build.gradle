plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def releaseBuild = (providers.gradleProperty('release')
        .orElse(providers.environmentVariable('RELEASE'))
        .getOrElse('false')).toBoolean()

version = releaseBuild ? mod_version : "${mod_version}-SNAPSHOT.${new Date().format('yyyyMMdd-HHmmss')}"
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "OctoStudios"
        url = uri("https://maven.octo-studios.com/releases")
    }
}

base {
    archivesName = mod_id + "-" + minecraft_version + "-NeoForge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

tasks.named('test') { enabled = false }

neoForge {
    version = project.neoforge_full_version

    interfaceInjectionData.from(provider {
        zipTree(configurations.geckolibArtifact.singleFile).matching {
            include 'META-INF/interface_injections.json'
        }
    })

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlayWorld').toString())
            }
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.add('--nogui')
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            clientData()
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    geckolibArtifact { transitive = false }
}

dependencies {
    implementation "maven.modrinth:geckolib:${geckolib_modrinth_id}"
    geckolibArtifact "maven.modrinth:geckolib:${geckolib_modrinth_id}"

    implementation "maven.modrinth:curios:dRnRThvD"
    implementation "curse.maven:jade-324717:7938398"
    implementation "maven.modrinth:modonomicon:fMVuqVVc"
    implementation "maven.modrinth:durability-display:7GxQSk24"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neoforge_full_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

}

def deployDir = providers.gradleProperty('nautec_deploy_dir')
        .orElse(providers.environmentVariable('NAUTEC_DEPLOY_DIR'))

tasks.register('deployToPack') {
    group = 'nautec'
    description = 'Builds and drops the jar into a modpack instance, clearing out older Nautec jars first'
    dependsOn tasks.named('build')

    doLast {
        if (!deployDir.isPresent()) {
            throw new GradleException("No target set. Put nautec_deploy_dir in gradle.properties or set "
                    + "NAUTEC_DEPLOY_DIR, pointing at the instance's mods folder, or pass "
                    + "-Pnautec_deploy_dir=<path>")
        }

        def mods = file(deployDir.get())
        if (!mods.isDirectory()) {
            throw new GradleException("Not a directory: ${mods}")
        }

        def built = tasks.jar.archiveFile.get().asFile
        mods.listFiles({ File candidate ->
            candidate.name.startsWith(mod_id + "-") && candidate.name.endsWith(".jar")
        } as FileFilter).each {
            if (it.name != built.name) {
                logger.lifecycle("removing stale ${it.name}")
            }
            it.delete()
        }

        copy {
            from built
            into mods
        }
        logger.lifecycle("deployed ${built.name} to ${mods}")
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
