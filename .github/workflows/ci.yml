name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and run required GameTests
        shell: bash
        run: |
          set -o pipefail
          bash gradlew build runGameTestServer | tee gametests.log
          grep -Eq 'All [0-9]+ required tests passed' gametests.log
      - name: Regenerate and verify data
        run: |
          xvfb-run -a bash gradlew runClientData
          git diff --exit-code -- src/generated/resources
          test -z "$(git ls-files --others --exclude-standard src/generated/resources)"
