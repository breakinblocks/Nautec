## Build Properties

# Builds are snapshots by default: 0.5.1-SNAPSHOT.<yyyyMMdd-HHmmss>, stamped into the jar name and into
# neoforge.mods.toml, so two builds are never the same artifact. Pass -Prelease=true for a clean
# mod_version jar when cutting an actual release.

# Target for `gradlew deployToPack`, pointing at a modpack instance's mods folder. Machine specific, so
# set it in ~/.gradle/gradle.properties, in NAUTEC_DEPLOY_DIR, or with -Pnautec_deploy_dir=<path>.
# nautec_deploy_dir = C:/Users/you/curseforge/minecraft/Instances/Your Pack/mods

