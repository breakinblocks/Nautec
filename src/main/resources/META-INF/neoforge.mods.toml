modLoader = "javafml"

loaderVersion = "${loader_version_range}"

license = "${mod_license}"

issueTrackerURL = "https://github.com/breakinblocks/Nautec/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/breakinblocks/Nautec"

description = '''${mod_description}'''

enumExtensions = "META-INF/enumextensions.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "guideme"
type = "optional"
versionRange = "[21.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "geckolib"
type = "required"
versionRange = "[4.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "curios"
type = "required"
versionRange = "[9.5,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "starcatcher"
type = "optional"
versionRange = "[3.3,)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "${mod_id}.mixins.json"